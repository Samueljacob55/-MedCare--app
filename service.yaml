apiVersion: v1
kind: Service
metadata:
  name: healthcare-app-service
  namespace: healthcare
  labels:
    app: healthcare-app
spec:
  selector:
    app: healthcare-app
  ports:
  - port: 80
    targetPort: 5000
    protocol: TCP
    name: http
  type: LoadBalancer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: healthcare-app-ingress
  namespace: healthcare
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - host: healthcare.yourdomain.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: healthcare-app-service
            port:
              number: 80